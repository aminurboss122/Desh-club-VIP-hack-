<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AMINUR BOSS · Desh club PRO HACK (100 HISTORY)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    html, body { width:100%; height:100%; background:radial-gradient(circle at 20% 30%, #0a0015, #000000); overflow:hidden; font-family:'Rajdhani', sans-serif; }
    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background-image: repeating-linear-gradient(45deg, rgba(138,43,226,0.08) 0px, rgba(138,43,226,0.08) 2px, transparent 2px, transparent 12px), radial-gradient(circle at 70% 40%, rgba(255,215,0,0.1) 0%, transparent 60%); pointer-events:none; z-index:0; }
    .flash-overlay { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:200; transition:0.15s; background:transparent; opacity:0; }
    .confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:150; }
    .toast-message { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%); background:linear-gradient(135deg,#ffd966,#ffb347); color:#1a0a2a; font-family:'Orbitron',monospace; font-size:2rem; font-weight:900; padding:15px 30px; border-radius:80px; box-shadow:0 0 80px rgba(255,215,0,0.9); text-transform:uppercase; letter-spacing:4px; z-index:250; white-space:nowrap; animation:floatPop 0.6s cubic-bezier(0.34,1.2,0.64,1); backdrop-filter:blur(8px); border:2px solid white; }
    @keyframes floatPop { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.3); filter:blur(8px); } 40% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 100% { opacity:0; transform:translate(-50%,-70%) scale(1); filter:blur(0); } }
    .loss-toast { background:linear-gradient(135deg,#8b0000,#ff4d4d); color:#fff0c0; box-shadow:0 0 70px rgba(255,0,0,0.7); }
    #app { position:relative; height:100%; display:flex; flex-direction:column; z-index:10; }
    .head { width:100%; padding:8px 16px; background:rgba(8,0,20,0.85); backdrop-filter:blur(16px); border-bottom:2px solid #ffd966; display:flex; justify-content:space-between; align-items:center; box-shadow:0 8px 32px rgba(0,0,0,0.6); flex-shrink:0; }
    .head h1 { font-family:'Orbitron'; font-size:14px; background:linear-gradient(135deg,#ffdd77,#ffaa33); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:1px; flex-grow:1; text-align:center; }
    .r-btn { background:#1e0a30; border:1px solid #ffd966; color:#ffdd99; padding:4px 10px; border-radius:40px; font-family:'Orbitron'; font-size:9px; font-weight:bold; cursor:pointer; }
    .abox { display:flex; flex-direction:column; flex:1; max-width:600px; width:95%; margin:6px auto; padding:5px 8px; gap:8px; min-height:0; height:100%; }
    .tabs { display:flex; gap:12px; flex-shrink:0; }
    .tab { flex:1; padding:6px 0; background:#0c0218; border:1px solid #7700ff; color:#c9aaff; text-align:center; font-family:'Orbitron'; font-size:11px; font-weight:bold; border-radius:60px; cursor:pointer; }
    .tab.active { background:linear-gradient(95deg,#bd00ff,#00eaff); color:#000; border:none; box-shadow:0 0 20px #bd00ff; }
    .card { background:rgba(8,3,18,0.9); backdrop-filter:blur(10px); border-radius:28px; border:1px solid rgba(255,215,0,0.6); padding:10px 10px; text-align:center; flex-shrink:0; }
    .timer { font-size:42px; font-weight:900; font-family:'Orbitron'; color:#ffecb3; text-shadow:0 0 12px #ffaa33; letter-spacing:4px; }
    .period { color:#aaffdd; font-size:10px; background:#1a0a2a; display:inline-block; padding:2px 10px; border-radius:40px; }
    .ptxt { font-size:34px; font-weight:900; font-family:'Orbitron'; margin:4px 0; text-transform:uppercase; }
    .t-big { color:#ff66ff; text-shadow:0 0 30px #ff44ff; }
    .t-sml { color:#33ffff; text-shadow:0 0 30px #00ffff; }
    .brow { display:flex; justify-content:center; gap:20px; margin-top:5px; }
    .ball { width:55px; height:55px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; background:#0a0015; border:2px solid #ffd966; color:#ffd966; }
    .ball.o1 { border-color:gold; box-shadow:0 0 28px gold; animation:pulseGlow 1.2s infinite; }
    .ball.o2 { border-color:#c084fc; box-shadow:0 0 18px #c084fc; }
    @keyframes pulseGlow { 0% { box-shadow:0 0 5px gold; } 100% { box-shadow:0 0 28px gold; } }
    .history-header { display:flex; justify-content:space-between; align-items:baseline; padding:0 6px; margin-bottom:4px; flex-shrink:0; }
    .history-header span:first-child { font-family:'Orbitron'; font-size:10px; color:#ffd966; }
    .history-header span:last-child { font-size:9px; color:#aa88ff; background:#1e0a30; padding:2px 6px; border-radius:20px; }
    .hbox { flex:1; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); border-radius:20px; overflow:hidden; border:1px solid #4a2a7a; display:flex; flex-direction:column; min-height:0; }
    .hhead { display:flex; background:#230d36; padding:6px 6px; font-family:'Orbitron'; font-weight:bold; font-size:9px; color:#ffd966; border-bottom:1px solid #bd00ff; flex-shrink:0; }
    .hbody { overflow-y:auto; flex:1; padding-bottom:10px; }
    .hbody::-webkit-scrollbar { width:5px; }
    .hbody::-webkit-scrollbar-track { background:#1a0a2a; border-radius:10px; }
    .hbody::-webkit-scrollbar-thumb { background:#bd00ff; border-radius:10px; }
    .row { display:flex; padding:6px 4px; border-bottom:1px solid #2a1240; font-size:10px; align-items:center; }
    .col { flex:1; text-align:center; color:#ddd9ff; }
    .win { color:#aaff88; font-weight:bold; text-shadow:0 0 4px greenyellow; }
    .loss { color:#ff8080; font-weight:bold; }
    .wait { color:#ffb347; font-weight:bold; animation:fadePulse 1s infinite; }
    @keyframes fadePulse { 0% { opacity:0.6; } 100% { opacity:1; } }
  </style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>🔥 AMINUR BOSS · Desh club HACK (V.3) 🔥</h1>
    <button class="r-btn" onclick="clearHistory()">🧹 CLEAR</button>
  </div>
  <div class="abox">
    <div class="tabs">
      <div id="t30" class="tab active" onclick="switchGame('30S')">✨ WinGo 30S</div>
      <div id="t60" class="tab" onclick="switchGame('1M')">⚡ WinGo 1M</div>
    </div>
    <div class="card">
      <div id="pid" class="period">🕒 XS STORE PRO</div>
      <div id="tmr" class="timer">00:00</div>
      <div id="pbx" class="ptxt t-sml">--</div>
      <div class="brow">
        <div class="bbox"><div class="lbl">🎯 PRIME</div><div id="n1" class="ball o1">?</div></div>
        <div class="bbox"><div class="lbl">🔄 BACKUP</div><div id="n2" class="ball o2">?</div></div>
      </div>
    </div>
    <div class="history-header">
      <span>📜 PREDICTION HISTORY (LAST 100)</span>
      <span id="historyCount">0/100</span>
    </div>
    <div class="hbox">
      <div class="hhead"><div class="col">PERIOD</div><div class="col" style="flex:1.5">PREDICTION</div><div class="col">RESULT</div><div class="col">STATUS</div></div>
      <div class="hbody" id="hl"></div>
    </div>
  </div>
</div>
<canvas id="confettiCanvas" class="confetti-canvas"></canvas>
<div id="flashOverlay" class="flash-overlay"></div>

<script>
  const STORAGE_KEY = "XS_STORE_PRO_V2";
  let currentMode = '30S';
  let currentPeriod = '';
  let history30 = [];
  let history1M = [];
  const MAX_HISTORY = 100;
  
  const API_URLS = {
    '30S': 'https://mastermindteam.top/api/wingo/30s.json',
    '1M': 'https://mastermindteam.top/api/wingo/1m.json'
  };
  
  let audioCtx = null;
  function initAudio() { if (!audioCtx && window.AudioContext) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playWinSound() { try { initAudio(); if(!audioCtx) return; const now=audioCtx.currentTime; const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type='sine'; osc.frequency.value=880; gain.gain.value=0.35; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, now+0.5); osc.stop(now+0.5); } catch(e){} }
  function playLossSound() { try { initAudio(); if(!audioCtx) return; const now=audioCtx.currentTime; const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type='sawtooth'; osc.frequency.value=340; gain.gain.value=0.3; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, now+0.6); osc.stop(now+0.6); } catch(e){} }
  function speakSignalProfit() { if(!window.speechSynthesis) return; window.speechSynthesis.cancel(); const msg1=new SpeechSynthesisUtterance("সিগন্যাল প্রফিট"); msg1.lang="bn-BD"; msg1.rate=0.95; msg1.pitch=1.1; msg1.volume=0.9; const msg2=new SpeechSynthesisUtterance("Signal Profit"); msg2.lang="en-US"; msg2.rate=1.0; msg2.pitch=1.3; msg2.volume=0.75; window.speechSynthesis.speak(msg1); setTimeout(()=>window.speechSynthesis.speak(msg2),120); }
  function speakLossMessage() { if(!window.speechSynthesis) return; const msg=new SpeechSynthesisUtterance("Your Signal loss"); msg.rate=0.95; msg.pitch=0.8; msg.volume=0.8; window.speechSynthesis.cancel(); window.speechSynthesis.speak(msg); }
  function flashScreen(color,intensity=0.7){ const overlay=document.getElementById('flashOverlay'); overlay.style.backgroundColor=color; overlay.style.opacity=intensity; setTimeout(()=>overlay.style.opacity='0',250); }
  function spawnConfetti(){ const canvas=document.getElementById('confettiCanvas'); const ctx=canvas.getContext('2d'); canvas.width=window.innerWidth; canvas.height=window.innerHeight; let particles=[]; for(let i=0;i<140;i++){ particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height, size:Math.random()*6+3, speedY:Math.random()*8+5, speedX:(Math.random()-0.5)*3, color:`hsl(${Math.random()*360},100%,60%)`, rotation:Math.random()*360 }); } let animFrame; function drawConfetti(){ ctx.clearRect(0,0,canvas.width,canvas.height); let active=false; for(let p of particles){ p.y+=p.speedY; p.x+=p.speedX; if(p.y<canvas.height+50) active=true; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation*Math.PI/180); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); } if(active) animFrame=requestAnimationFrame(drawConfetti); else cancelAnimationFrame(animFrame); } drawConfetti(); setTimeout(()=>{ if(animFrame) cancelAnimationFrame(animFrame); ctx.clearRect(0,0,canvas.width,canvas.height); },1700); }
  function triggerWinEffect(type){ playWinSound(); speakSignalProfit(); const toastDiv=document.createElement('div'); toastDiv.className='toast-message'; toastDiv.innerText=type==='JACKPOT'?'🔥 JACKPOT + SIGNAL PROFIT 🔥':'💰 সিগন্যাল প্রফিট 💰'; document.body.appendChild(toastDiv); flashScreen('#ffd700',0.75); spawnConfetti(); document.body.style.boxShadow='inset 0 0 100px rgba(255,215,0,0.8)'; setTimeout(()=>document.body.style.boxShadow='',500); setTimeout(()=>toastDiv.remove(),1500); if(navigator.vibrate) navigator.vibrate(200); }
  function triggerLossEffect(){ playLossSound(); speakLossMessage(); const toastDiv=document.createElement('div'); toastDiv.className='toast-message loss-toast'; toastDiv.innerText='⚠️ YOUR SIGNAL LOSS ⚠️'; document.body.appendChild(toastDiv); flashScreen('#b00030',0.6); document.body.style.transform='translateX(3px)'; setTimeout(()=>document.body.style.transform='',100); if(navigator.vibrate) navigator.vibrate(100); setTimeout(()=>toastDiv.remove(),1300); }
  
  let lastPeriod = "";
  function generateHackPrediction(periodNumber) {
    if (periodNumber === lastPeriod) return null;
    let prediction = Math.random() > 0.5 ? "BIG" : "SMALL";
    let num1 = prediction === "BIG" ? Math.floor(Math.random() * 5) + 5 : Math.floor(Math.random() * 5);
    let num2 = (num1 + 5) % 10;
    lastPeriod = periodNumber;
    return { bs: prediction, nums: [num1, num2], isBig: prediction === "BIG" };
  }
  
  function loadHistory() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) { try { const data=JSON.parse(raw); history30=data.h30||[]; history1M=data.h1M||[]; if(history30.length>MAX_HISTORY) history30=history30.slice(0,MAX_HISTORY); if(history1M.length>MAX_HISTORY) history1M=history1M.slice(0,MAX_HISTORY); } catch(e){} }
    if(!history30.length) history30=[]; if(!history1M.length) history1M=[];
  }
  function saveHistory() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ h30:history30.slice(0,MAX_HISTORY), h1M:history1M.slice(0,MAX_HISTORY) })); }
  function getHistory() { return currentMode==='30S'?history30:history1M; }
  function setHistory(arr) { const trimmed=arr.slice(0,MAX_HISTORY); if(currentMode==='30S') history30=trimmed; else history1M=trimmed; saveHistory(); updateCounter(); }
  function updateCounter() { const cnt=getHistory().length; const span=document.getElementById('historyCount'); if(span) span.innerText=`${cnt}/${MAX_HISTORY}`; }
  
  function renderHistoryTable() {
    const container = document.getElementById('hl');
    if(!container) return;
    const hist = getHistory();
    container.innerHTML = '';
    for(let i=0; i<hist.length; i++) {
      const e = hist[i];
      const row = document.createElement('div');
      row.className = 'row';
      let statusClass = '';
      let statusText = e.status;
      if(e.status === 'WIN') statusClass = 'win';
      else if(e.status === 'LOSS') statusClass = 'loss';
      else if(e.status === 'WAIT') statusClass = 'wait';
      else if(e.status === 'JACKPOT') statusClass = 'win';
      row.innerHTML = `
        <div class="col">${e.period}</div>
        <div class="col" style="flex:1.5">${e.bs}</div>
        <div class="col">${e.res !== '-' ? e.res : '--'}</div>
        <div class="col ${statusClass}">${statusText}</div>
      `;
      container.appendChild(row);
    }
  }
  
  function updateUIAndHistory(pred, period, existingHistory) {
    if(!pred) return;
    // Check if period already exists
    let existing = existingHistory.find(h => h.period === period);
    if(!existing) {
      const newEntry = {
        period: period,
        bs: pred.bs,
        nums: pred.nums,
        res: '-',
        status: 'WAIT'
      };
      existingHistory.unshift(newEntry);
      if(existingHistory.length > MAX_HISTORY) existingHistory.pop();
      setHistory(existingHistory);
    } else {
      // update only UI
    }
    document.getElementById('pbx').innerText = pred.bs;
    document.getElementById('n1').innerText = pred.nums[0];
    document.getElementById('n2').innerText = pred.nums[1];
    renderHistoryTable();
  }
  
  function updateExistingResult(periodNum, resultNumber) {
    let hist = getHistory();
    let updated = false;
    for(let i=0; i<hist.length; i++) {
      if(hist[i].period === periodNum && hist[i].status === 'WAIT') {
        const entry = hist[i];
        entry.res = resultNumber;
        const isJackpot = (entry.nums[0] === resultNumber || entry.nums[1] === resultNumber);
        if(isJackpot) {
          entry.status = 'JACKPOT';
          triggerWinEffect('JACKPOT');
        } else {
          const predBig = (entry.bs === 'BIG');
          const resBig = (resultNumber >= 5);
          if(predBig === resBig) {
            entry.status = 'WIN';
            triggerWinEffect('WIN');
          } else {
            entry.status = 'LOSS';
            triggerLossEffect();
          }
        }
        updated = true;
        break;
      }
    }
    if(updated) {
      setHistory(hist);
      renderHistoryTable();
    }
  }
  
  async function syncPrediction(forceUpdate = false) {
    try {
      const url = API_URLS[currentMode];
      const resp = await fetch(`${url}?t=${Date.now()}`);
      const data = await resp.json();
      if (!data || data.Toms_Api_Status !== "Success" || !data.data || !data.data.list) {
        console.warn("Invalid API response");
        return;
      }
      const list = data.data.list;
      if(!list || list.length < 2) return;
      
      let hist = getHistory();
      // Update WAIT entries with actual results
      for(let serverItem of list.slice(0, 50)) {
        const periodStr = serverItem.issueNumber;
        const resultNum = parseInt(serverItem.number);
        const found = hist.find(h => h.period === periodStr && h.status === 'WAIT');
        if(found && found.res === '-') {
          updateExistingResult(periodStr, resultNum);
        }
      }
      hist = getHistory();
      
      const latestPeriod = list[0].issueNumber;
      const nextPeriodNum = (BigInt(latestPeriod) + 1n).toString();
      const nextPeriod = nextPeriodNum;
      
      if(currentPeriod !== nextPeriod || forceUpdate) {
        currentPeriod = nextPeriod;
        const hackPred = generateHackPrediction(nextPeriod);
        if (hackPred) {
          updateUIAndHistory(hackPred, nextPeriod, hist);
        } else {
          const fallbackPred = { bs: Math.random() > 0.5 ? "BIG" : "SMALL", nums: [5,0], isBig: true };
          updateUIAndHistory(fallbackPred, nextPeriod, hist);
        }
      }
      
      // Update timer (mock countdown for 30s / 60s)
      const periodSec = currentMode === '30S' ? 30 : 60;
      const now = Date.now();
      const serverTime = new Date().getTime(); // fallback
      const elapsed = (serverTime % (periodSec * 1000));
      let remaining = periodSec - Math.floor(elapsed / 1000);
      if(remaining < 0) remaining = 0;
      document.getElementById('tmr').innerText = `00:${remaining.toString().padStart(2,'0')}`;
      document.getElementById('pid').innerHTML = `🕒 PERIOD: ${currentPeriod}`;
    } catch(e) { console.error(e); }
  }
  
  function switchGame(mode) {
    currentMode = mode;
    currentPeriod = '';
    document.getElementById('t30').classList.remove('active');
    document.getElementById('t60').classList.remove('active');
    if(mode === '30S') document.getElementById('t30').classList.add('active');
    else document.getElementById('t60').classList.add('active');
    loadHistory();
    renderHistoryTable();
    updateCounter();
    syncPrediction(true);
    if(window.interval) clearInterval(window.interval);
    window.interval = setInterval(() => syncPrediction(false), 2000);
  }
  
  function clearHistory() {
    if(currentMode === '30S') history30 = [];
    else history1M = [];
    saveHistory();
    renderHistoryTable();
    updateCounter();
  }
  
  loadHistory();
  switchGame('30S');
</script>
</body>
</html>
